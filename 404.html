<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback for GitHub Pages (rafgraph/spa-github-pages).
      // Serves this file for unknown paths; redirect into index.html while
      // encoding the path in the query string for the restore script.
      (function () {
        var knownRoutes = { login: 1, profile: 1 };
        var segments = location.pathname.split("/").filter(Boolean);
        var pathSegmentsToKeep =
          segments.length && !knownRoutes[segments[0]] ? 1 : 0;

        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(pathSegmentsToKeep)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search
              ? "&" + l.search.slice(1).replace(/&/g, "~and~")
              : "") +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
